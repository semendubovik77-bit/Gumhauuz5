<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание уроков</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --header: #ffffff;
      --border: #e2e8f0;
      --accent: #1d4ed8;
      --accent-light: #dbeafe;
      --highlight: #d97706;
      --highlight-bg: #fef3c7;
      --text: #0f172a;
      --muted: #64748b;
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --zamen-bg: #ecfdf5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      background: var(--header);
      height: 70px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .header-left { display: flex; flex-direction: column; gap: 1px; }
    .title { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; }
    .subtitle { font-size: 0.88rem; color: var(--muted); font-weight: 500; }

    .header-center { text-align: center; }
    .clock {
      font-size: 2.35rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .date { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }

    .day-buttons { display: flex; gap: 6px; }
    .day-btn {
      background: #f1f5f9;
      border: none;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .day-btn:hover { background: var(--accent-light); color: var(--accent); }
    .day-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 14px rgba(29,78,216,0.3);
    }

    main {
      height: calc(100vh - 70px);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .block {
      flex: 1;
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .block-title {
      background: #f8fafc;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 8px 2px;
      border-bottom: 2px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }
    th:first-child { width: 52px; color: var(--accent); }
    th:nth-child(2) { width: 96px; color: var(--muted); font-weight: 600; }

    td {
      padding: 4px 2px;
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
    }

    td:first-child {
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--accent);
      background: #f8fafc;
    }
    td:nth-child(2) {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      background: #f8fafc;
      font-weight: 500;
    }

    tr:nth-child(even) td { background: #fafbfc; }
    tr:nth-child(even) td:first-child,
    tr:nth-child(even) td:nth-child(2) { background: #f1f5f9; }

    tr.current-lesson td { background: var(--highlight-bg) !important; }
    tr.current-lesson td:first-child {
      color: #b45309;
      box-shadow: inset 4px 0 0 var(--highlight);
    }

    .zamen .subj { color: #047857; }
    .zamen .cab { color: #059669; }
    td.zamen-cell { background: var(--zamen-bg) !important; }

    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 1px;
    }
    .subj {
      font-size: 0.77rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .cab {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }
    .empty { color: #cbd5e1; font-size: 0.9rem; }

    .status {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--muted);
    }

    @media (min-width: 1800px) {
      .clock { font-size: 2.7rem; }
      .subj { font-size: 0.86rem; }
      .cab { font-size: 0.75rem; }
      th { font-size: 0.98rem; }
    }
    @media (min-width: 2300px) {
      .clock { font-size: 3.1rem; }
      .subj { font-size: 0.95rem; }
      .cab { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="title">Расписание уроков</div>
      <div class="subtitle" id="day-label">Загрузка...</div>
    </div>
    <div class="header-center">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="day-buttons" id="day-buttons"></div>
  </header>

  <main id="main">
    <div class="status">Загрузка расписания...</div>
  </main>

  <script>
    const CSV_URLS = {
      1: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=147080593&single=true&output=csv',
      2: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=116172814&single=true&output=csv',
      3: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=96572830&single=true&output=csv',
      4: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=1127679919&single=true&output=csv',
      5: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=1740432170&single=true&output=csv',
      6: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=1169394762&single=true&output=csv'
    };

    const ZAMENY_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=1223748245&single=true&output=csv';

    const DAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    const TOP_CLASSES    = ['1А','1Б','2А','2Б','3А','3Б','4А','4Б','5А','5Б'];
    const BOTTOM_CLASSES = ['6А','6Б','7А','7Б','7В','8А','8Б','9А','9Б','10А','11А'];

    let currentDayIndex = null;
    let scheduleData = null;
    let zamenyData = [];

    function getTodayDayIndex() {
      const d = new Date().getDay();
      return d === 0 ? 1 : d;
    }

    function getTodayDateStr() {
      const n = new Date();
      return String(n.getDate()).padStart(2,'0') + '.' +
             String(n.getMonth()+1).padStart(2,'0') + '.' +
             n.getFullYear();
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 1) return null;
      const parseRow = (line) => {
        const r = []; let cur = ''; let q = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') q = !q;
          else if (c === ',' && !q) { r.push(cur.trim()); cur = ''; }
          else cur += c;
        }
        r.push(cur.trim());
        return r;
      };
      return lines.map(parseRow);
    }

    function parseTimeRange(str) {
      if (!str) return null;
      const m = str.match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/);
      if (!m) return null;
      return { start: +m[1]*60 + +m[2], end: +m[3]*60 + +m[4] };
    }

    function getCurrentMinutes() {
      const n = new Date();
      return n.getHours()*60 + n.getMinutes();
    }

    function formatCell(subj, cab, isZamen = false) {
      subj = (subj || '').trim();
      cab  = (cab  || '').trim();
      if (!subj && !cab) return '<span class="empty">—</span>';

      let cabText = '';
      if (cab) {
        if (cab.toLowerCase().includes('спорт') || cab.toLowerCase().includes('каб')) {
          cabText = cab;
        } else {
          cabText = 'каб. ' + cab;
        }
      }

      const zamenClass = isZamen ? ' zamen' : '';
      return `<div class="cell${zamenClass}">
                <div class="subj">${esc(subj || '—')}</div>
                ${cabText ? `<div class="cab">${esc(cabText)}</div>` : ''}
              </div>`;
    }

    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function updateClock() {
      const n = new Date();
      document.getElementById('clock').textContent =
        String(n.getHours()).padStart(2,'0') + ':' +
        String(n.getMinutes()).padStart(2,'0') + ':' +
        String(n.getSeconds()).padStart(2,'0');
      document.getElementById('date').textContent = n.toLocaleDateString('ru-RU', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    // Загружаем замены отдельно (не сбрасываем старые данные сразу)
    async function loadZameny() {
      try {
        const res = await fetch(ZAMENY_URL + '&_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const rows = parseCSV(await res.text());
        if (!rows) return;

        let start = 0;
        for (let i = 0; i < rows.length; i++) {
          if (rows[i][0] && rows[i][0].toLowerCase().includes('дата')) {
            start = i + 1;
            break;
          }
        }

        const today = getTodayDateStr();
        const newZameny = [];

        for (let i = start; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !r[1] || !r[2]) continue;
          const date = r[0].trim();
          if (date === today) {
            newZameny.push({
              date: date,
              class: r[1].trim(),
              lesson: r[2].trim(),
              subject: (r[3] || '').trim(),
              cabinet: (r[4] || '').trim()
            });
          }
        }

        zamenyData = newZameny;

        // Если расписание уже загружено — просто перерисуем
        if (scheduleData) render();
      } catch (e) {
        console.log('Ошибка загрузки замен:', e);
      }
    }

    async function loadSchedule(dayIndex, isAuto = false) {
      try {
        if (!isAuto) {
          // При ручном переключении показываем загрузку только если данных ещё нет
          if (!scheduleData) {
            document.getElementById('main').innerHTML = '<div class="status">Загрузка...</div>';
          }
        }

        const res = await fetch(CSV_URLS[dayIndex] + '&_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('Ошибка сети');
        const rows = parseCSV(await res.text());
        if (!rows || rows.length < 2) throw new Error('Нет данных');

        scheduleData = {
          headers: rows[0],
          rows: rows.slice(1).filter(r => r[0])
        };
        currentDayIndex = dayIndex;
        updateDayLabel();
        render();   // рисуем сразу, замены уже есть в памяти
      } catch (e) {
        document.getElementById('main').innerHTML = `<div class="status" style="color:#ef4444">${e.message}</div>`;
      }
    }

    function getZamen(className, lessonNum) {
      return zamenyData.find(z => 
        z.class === className && 
        (z.lesson === String(lessonNum) || z.lesson === lessonNum)
      );
    }

    function buildTable(classList) {
      const { headers, rows } = scheduleData;
      const classIndexes = {};
      for (let i = 2; i < headers.length; i += 2) {
        classIndexes[headers[i]] = i;
      }

      const now = getCurrentMinutes();

      let html = '<table><thead><tr><th>№</th><th>Время</th>';
      classList.forEach(cls => html += `<th>${cls}</th>`);
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        const num = row[0] || '';
        const time = row[1] || '';
        const range = parseTimeRange(time);
        const cur = range && now >= range.start && now < range.end;
        const displayNum = (num === 'Классный час') ? 'Кл.час' : num;

        html += `<tr class="${cur ? 'current-lesson' : ''}">`;
        html += `<td>${displayNum}</td><td>${time}</td>`;

        classList.forEach(cls => {
          const idx = classIndexes[cls];
          const zamen = getZamen(cls, num);

          if (zamen) {
            html += `<td class="zamen-cell">${formatCell(zamen.subject, zamen.cabinet, true)}</td>`;
          } else if (idx === undefined) {
            html += '<td><span class="empty">—</span></td>';
          } else {
            const subj = row[idx] || '';
            const cab  = row[idx + 1] || '';
            html += `<td>${formatCell(subj, cab)}</td>`;
          }
        });

        html += '</tr>';
      });

      html += '</tbody></table>';
      return html;
    }

    function render() {
      if (!scheduleData) return;

      const zamenCount = zamenyData.length;
      const zamenInfo = zamenCount > 0 ? ` • <span style="color:#059669">Замен сегодня: ${zamenCount}</span>` : '';

      document.getElementById('main').innerHTML = `
        <div class="block">
          <div class="block-title">1 – 5 классы${zamenInfo}</div>
          ${buildTable(TOP_CLASSES)}
        </div>
        <div class="block">
          <div class="block-title">6 – 11 классы</div>
          ${buildTable(BOTTOM_CLASSES)}
        </div>
      `;
    }

    function renderDayButtons() {
      const box = document.getElementById('day-buttons');
      let html = '';
      for (let i = 1; i <= 6; i++) {
        html += `<button class="day-btn" data-day="${i}">${DAYS[i].slice(0,2)}</button>`;
      }
      box.innerHTML = html;
      box.querySelectorAll('.day-btn').forEach(btn => {
        btn.onclick = () => loadSchedule(+btn.dataset.day);
      });
    }

    function updateDayLabel() {
      const today = getTodayDayIndex();
      const el = document.getElementById('day-label');
      if (currentDayIndex === today) el.textContent = DAYS[currentDayIndex];
      else if (new Date().getDay() === 0 && currentDayIndex === 1) el.textContent = 'Расписание на понедельник';
      else el.textContent = DAYS[currentDayIndex] + ' (просмотр)';

      document.querySelectorAll('.day-btn').forEach(b => {
        b.classList.toggle('active', +b.dataset.day === currentDayIndex);
      });
    }

    function init() {
      renderDayButtons();
      updateClock();
      setInterval(updateClock, 1000);

      // Сначала загружаем замены, потом расписание
      loadZameny().then(() => {
        loadSchedule(getTodayDayIndex());
      });

      // Обновление расписания и замен каждые 10 секунд
      setInterval(() => {
        if (currentDayIndex) loadSchedule(currentDayIndex, true);
        loadZameny();
      }, 10000);

      // Подсветка текущего урока каждую минуту
      setInterval(() => scheduleData && render(), 60000);
    }

    init();
  </script>
</body>
</html>
