<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание уроков</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --header: #ffffff;
      --border: #e2e8f0;
      --accent: #1d4ed8;
      --accent-light: #dbeafe;
      --highlight: #d97706;
      --highlight-bg: #fef3c7;
      --text: #0f172a;
      --muted: #64748b;
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ===== ШАПКА ===== */
    header {
      background: var(--header);
      height: 70px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .header-left { display: flex; flex-direction: column; gap: 1px; }
    .title { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; }
    .subtitle { font-size: 0.88rem; color: var(--muted); font-weight: 500; }

    .header-center { text-align: center; }
    .clock {
      font-size: 2.35rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .date { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }

    .day-buttons { display: flex; gap: 6px; }
    .day-btn {
      background: #f1f5f9;
      border: none;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .day-btn:hover { background: var(--accent-light); color: var(--accent); }
    .day-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 14px rgba(29,78,216,0.3);
    }

    /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
    main {
      height: calc(100vh - 70px);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .block {
      flex: 1;
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .block-title {
      background: #f8fafc;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.02em;
    }

    table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 8px 3px;
      border-bottom: 2px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }
    th:first-child { width: 46px; color: var(--accent); }
    th:nth-child(2) { width: 98px; color: var(--muted); font-weight: 600; }

    td {
      padding: 5px 2px;
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
    }

    td:first-child {
      font-weight: 800;
      font-size: 1rem;
      color: var(--accent);
      background: #f8fafc;
    }
    td:nth-child(2) {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      background: #f8fafc;
      font-weight: 500;
    }

    tr:nth-child(even) td { background: #fafbfc; }
    tr:nth-child(even) td:first-child,
    tr:nth-child(even) td:nth-child(2) { background: #f1f5f9; }

    /* Текущий урок */
    tr.current-lesson td { background: var(--highlight-bg) !important; }
    tr.current-lesson td:first-child {
      color: #b45309;
      box-shadow: inset 4px 0 0 var(--highlight);
    }

    /* ===== ЯЧЕЙКА: ПРЕДМЕТ + КАБИНЕТ ===== */
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 1px;
    }
    .subj {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;          /* ← запрет переноса предмета */
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .cab {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }
    .empty { color: #cbd5e1; font-size: 0.95rem; }

    .status {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--muted);
    }

    /* Большие экраны */
    @media (min-width: 1800px) {
      .clock { font-size: 2.7rem; }
      .subj { font-size: 0.9rem; }
      .cab { font-size: 0.78rem; }
      th { font-size: 1.02rem; }
      td:first-child { font-size: 1.1rem; }
    }
    @media (min-width: 2300px) {
      .clock { font-size: 3.1rem; }
      .subj { font-size: 1rem; }
      .cab { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="title">Расписание уроков</div>
      <div class="subtitle" id="day-label">Загрузка...</div>
    </div>
    <div class="header-center">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="day-buttons" id="day-buttons"></div>
  </header>

  <main id="main">
    <div class="status">Загрузка расписания...</div>
  </main>

  <script>
    const CSV_URLS = {
      1: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=2095345960&single=true&output=csv',
      2: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=259046105&single=true&output=csv',
      3: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=230619713&single=true&output=csv',
      4: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=536572254&single=true&output=csv',
      5: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=1913105634&single=true&output=csv',
      6: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=1325481260&single=true&output=csv'
    };

    const DAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    // Какие классы в какой блок (можно менять)
    const TOP_CLASSES    = ['1А','1Б','2А','2Б','3А','3Б','4А','4Б','5А','5Б'];
    const BOTTOM_CLASSES = ['6А','6Б','7А','7Б','8А','8Б','9А','9Б','10А','11А'];

    let currentDayIndex = null;
    let scheduleData = null;

    function getTodayDayIndex() {
      const d = new Date().getDay();
      return d === 0 ? 1 : d;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return null;
      const parseRow = (line) => {
        const r = []; let cur = ''; let q = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') q = !q;
          else if (c === ',' && !q) { r.push(cur.trim()); cur = ''; }
          else cur += c;
        }
        r.push(cur.trim());
        return r;
      };
      return { headers: parseRow(lines[0]), rows: lines.slice(1).map(parseRow).filter(r => r[0]) };
    }

    function parseTimeRange(str) {
      if (!str) return null;
      const m = str.match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/);
      if (!m) return null;
      return { start: +m[1]*60 + +m[2], end: +m[3]*60 + +m[4] };
    }

    function getCurrentMinutes() {
      const n = new Date();
      return n.getHours()*60 + n.getMinutes();
    }

    function formatCell(text) {
      if (!text || !text.trim()) return '<span class="empty">—</span>';
      text = text.trim();
      const m = text.match(/^(.+?)\s*\((.+)\)$/);
      if (m) {
        return `<div class="cell">
                  <div class="subj">${esc(m[1])}</div>
                  <div class="cab">${esc(m[2])}</div>
                </div>`;
      }
      return `<div class="cell"><div class="subj">${esc(text)}</div></div>`;
    }

    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function updateClock() {
      const n = new Date();
      document.getElementById('clock').textContent =
        String(n.getHours()).padStart(2,'0') + ':' +
        String(n.getMinutes()).padStart(2,'0') + ':' +
        String(n.getSeconds()).padStart(2,'0');
      document.getElementById('date').textContent = n.toLocaleDateString('ru-RU', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    async function loadSchedule(dayIndex, isAuto = false) {
      try {
        if (!isAuto) document.getElementById('main').innerHTML = '<div class="status">Загрузка...</div>';
        const res = await fetch(CSV_URLS[dayIndex] + '&_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('Ошибка сети');
        const data = parseCSV(await res.text());
        if (!data || !data.rows.length) throw new Error('Нет данных');
        scheduleData = data;
        currentDayIndex = dayIndex;
        updateDayLabel();
        render();
      } catch (e) {
        document.getElementById('main').innerHTML = `<div class="status" style="color:#ef4444">${e.message}</div>`;
      }
    }

    function buildTable(classList) {
      const { headers, rows } = scheduleData;
      const allClasses = headers.slice(2);
      const indexes = classList.map(c => allClasses.indexOf(c)).filter(i => i >= 0);
      const now = getCurrentMinutes();

      let html = '<table><thead><tr><th>№</th><th>Время</th>';
      indexes.forEach(i => html += `<th>${allClasses[i]}</th>`);
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        const num = row[0] || '';
        const time = row[1] || '';
        const range = parseTimeRange(time);
        const cur = range && now >= range.start && now < range.end;

        html += `<tr class="${cur ? 'current-lesson' : ''}">`;
        html += `<td>${num}</td><td>${time}</td>`;
        indexes.forEach(i => html += `<td>${formatCell(row[i+2])}</td>`);
        html += '</tr>';
      });

      html += '</tbody></table>';
      return html;
    }

    function render() {
      const main = document.getElementById('main');
      main.innerHTML = `
        <div class="block">
          <div class="block-title">1 – 5 классы</div>
          ${buildTable(TOP_CLASSES)}
        </div>
        <div class="block">
          <div class="block-title">6 – 11 классы</div>
          ${buildTable(BOTTOM_CLASSES)}
        </div>
      `;
    }

    function renderDayButtons() {
      const box = document.getElementById('day-buttons');
      let html = '';
      for (let i = 1; i <= 6; i++) {
        html += `<button class="day-btn" data-day="${i}">${DAYS[i].slice(0,2)}</button>`;
      }
      box.innerHTML = html;
      box.querySelectorAll('.day-btn').forEach(btn => {
        btn.onclick = () => loadSchedule(+btn.dataset.day);
      });
    }

    function updateDayLabel() {
      const today = getTodayDayIndex();
      const el = document.getElementById('day-label');
      if (currentDayIndex === today) el.textContent = DAYS[currentDayIndex];
      else if (new Date().getDay() === 0 && currentDayIndex === 1) el.textContent = 'Расписание на понедельник';
      else el.textContent = DAYS[currentDayIndex] + ' (просмотр)';

      document.querySelectorAll('.day-btn').forEach(b => {
        b.classList.toggle('active', +b.dataset.day === currentDayIndex);
      });
    }

    function init() {
      renderDayButtons();
      updateClock();
      setInterval(updateClock, 1000);
      setInterval(() => scheduleData && render(), 60000);
      loadSchedule(getTodayDayIndex());
      setInterval(() => currentDayIndex && loadSchedule(currentDayIndex, true), 30000);
    }

    init();
  </script>
</body>
</html>
