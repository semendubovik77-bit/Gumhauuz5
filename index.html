<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание уроков</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --header: #ffffff;
      --card: #ffffff;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --highlight: #f59e0b;
      --highlight-bg: #fef3c7;
      --text: #1e293b;
      --text-muted: #64748b;
      --row-alt: #f8fafc;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ===== ШАПКА ===== */
    header {
      background: var(--header);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 78px;
      position: relative;
      z-index: 20;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 200px;
    }
    .title {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-center { text-align: center; }
    .clock {
      font-size: 2.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      line-height: 1;
      letter-spacing: 0.03em;
    }
    .date {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .day-buttons {
      display: flex;
      gap: 6px;
    }
    .day-btn {
      background: #f1f5f9;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .day-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .day-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
    main {
      height: calc(100vh - 78px);
      padding: 14px 16px 16px;
    }

    .table-wrapper {
      height: 100%;
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }

    th {
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 4px;
      border-bottom: 2px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }
    th:first-child { width: 52px; color: var(--accent); }
    th:nth-child(2) { width: 105px; color: var(--text-muted); font-weight: 600; }

    td {
      padding: 6px 3px;
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.25s ease;
    }

    td:first-child {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent);
      background: #f8fafc;
    }
    td:nth-child(2) {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      background: #f8fafc;
      font-weight: 500;
    }

    tbody tr:nth-child(even) td {
      background: var(--row-alt);
    }
    tbody tr:nth-child(even) td:first-child,
    tbody tr:nth-child(even) td:nth-child(2) {
      background: #f1f5f9;
    }

    /* Текущий урок */
    tr.current-lesson td {
      background: var(--highlight-bg) !important;
    }
    tr.current-lesson td:first-child {
      color: #b45309;
      box-shadow: inset 4px 0 0 var(--highlight);
    }

    /* ===== ДВЕ СТРОЧКИ В ЯЧЕЙКЕ ===== */
    .cell-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 2px 1px;
      line-height: 1.2;
    }
    .subject-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
      max-width: 100%;
    }
    .cabinet {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .empty {
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 1.3rem;
      color: var(--text-muted);
    }
    .status.error { color: #ef4444; }

    /* Большие экраны */
    @media (min-width: 1800px) {
      .clock { font-size: 2.9rem; }
      th { font-size: 1.05rem; padding: 14px 5px; }
      .subject-name { font-size: 0.88rem; }
      .cabinet { font-size: 0.78rem; }
      td:first-child { font-size: 1.15rem; }
    }
    @media (min-width: 2400px) {
      .clock { font-size: 3.3rem; }
      .subject-name { font-size: 0.98rem; }
      .cabinet { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="title">Расписание уроков</div>
      <div class="subtitle" id="day-label">Загрузка...</div>
    </div>

    <div class="header-center">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
    </div>

    <div class="day-buttons" id="day-buttons"></div>
  </header>

  <main>
    <div class="table-wrapper" id="table-wrapper">
      <div class="status">Загрузка расписания...</div>
    </div>
  </main>

  <script>
    const CSV_URLS = {
      1: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=2095345960&single=true&output=csv',
      2: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=259046105&single=true&output=csv',
      3: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=230619713&single=true&output=csv',
      4: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=536572254&single=true&output=csv',
      5: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=1913105634&single=true&output=csv',
      6: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSFXgIBRY8C-6jrsy8sLU38Y0sOxlF0Np7WEW9T0qzGcJGeT1Eto3CCJc7mNMtLkypjcF5yZNuaeP1H/pub?gid=1325481260&single=true&output=csv'
    };

    const DAYS = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const REFRESH_INTERVAL = 30000;

    let currentDayIndex = null;
    let scheduleData = null;

    function getTodayDayIndex() {
      const d = new Date().getDay();
      return d === 0 ? 1 : d;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return null;
      const parseRow = (line) => {
        const result = [];
        let current = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') inQuotes = !inQuotes;
          else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else current += char;
        }
        result.push(current.trim());
        return result;
      };
      return {
        headers: parseRow(lines[0]),
        rows: lines.slice(1).map(parseRow).filter(r => r[0])
      };
    }

    function parseTimeRange(str) {
      if (!str) return null;
      const m = str.match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/);
      if (!m) return null;
      return { start: +m[1]*60 + +m[2], end: +m[3]*60 + +m[4] };
    }

    function getCurrentMinutes() {
      const n = new Date();
      return n.getHours() * 60 + n.getMinutes();
    }

    // Разбиваем "Математика (каб. 204)" на две строки
    function formatCell(text) {
      if (!text || !text.trim()) return '<span class="empty">—</span>';
      text = text.trim();

      // Ищем кабинет в скобках
      const match = text.match(/^(.+?)\s*\((.+)\)$/);
      if (match) {
        return `
          <div class="cell-content">
            <div class="subject-name">${escapeHtml(match[1])}</div>
            <div class="cabinet">${escapeHtml(match[2])}</div>
          </div>`;
      }
      // Если просто текст без скобок
      return `
        <div class="cell-content">
          <div class="subject-name">${escapeHtml(text)}</div>
        </div>`;
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function updateClock() {
      const n = new Date();
      document.getElementById('clock').textContent =
        String(n.getHours()).padStart(2,'0') + ':' +
        String(n.getMinutes()).padStart(2,'0') + ':' +
        String(n.getSeconds()).padStart(2,'0');
      document.getElementById('date').textContent = n.toLocaleDateString('ru-RU', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    async function loadSchedule(dayIndex, isAuto = false) {
      const url = CSV_URLS[dayIndex] + '&_t=' + Date.now();
      try {
        if (!isAuto) {
          document.getElementById('table-wrapper').innerHTML = '<div class="status">Загрузка...</div>';
        }
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = parseCSV(await res.text());
        if (!data || !data.rows.length) throw new Error('Нет данных');
        scheduleData = data;
        currentDayIndex = dayIndex;
        updateDayLabel();
        renderTable();
      } catch (e) {
        document.getElementById('table-wrapper').innerHTML =
          `<div class="status error">Ошибка: ${e.message}</div>`;
      }
    }

    function renderTable() {
      if (!scheduleData) return;
      const { headers, rows } = scheduleData;
      const classHeaders = headers.slice(2);
      const nowMin = getCurrentMinutes();

      let html = '<table><thead><tr><th>№</th><th>Время</th>';
      classHeaders.forEach(c => html += `<th>${c}</th>`);
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        const num = row[0] || '';
        const time = row[1] || '';
        const range = parseTimeRange(time);
        const isCurrent = range && nowMin >= range.start && nowMin < range.end;

        html += `<tr class="${isCurrent ? 'current-lesson' : ''}">`;
        html += `<td>${num}</td><td>${time}</td>`;

        for (let i = 0; i < classHeaders.length; i++) {
          html += `<td>${formatCell(row[i + 2])}</td>`;
        }
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('table-wrapper').innerHTML = html;
    }

    function renderDayButtons() {
      const box = document.getElementById('day-buttons');
      let html = '';
      for (let i = 1; i <= 6; i++) {
        html += `<button class="day-btn" data-day="${i}">${DAYS[i].slice(0,2)}</button>`;
      }
      box.innerHTML = html;
      box.querySelectorAll('.day-btn').forEach(btn => {
        btn.onclick = () => loadSchedule(+btn.dataset.day);
      });
    }

    function updateDayLabel() {
      const today = getTodayDayIndex();
      const label = document.getElementById('day-label');
      if (currentDayIndex === today) {
        label.textContent = DAYS[currentDayIndex];
      } else if (new Date().getDay() === 0 && currentDayIndex === 1) {
        label.textContent = 'Расписание на понедельник';
      } else {
        label.textContent = DAYS[currentDayIndex] + ' (просмотр)';
      }
      document.querySelectorAll('.day-btn').forEach(b => {
        b.classList.toggle('active', +b.dataset.day === currentDayIndex);
      });
    }

    function init() {
      renderDayButtons();
      updateClock();
      setInterval(updateClock, 1000);
      setInterval(() => scheduleData && renderTable(), 60000);
      loadSchedule(getTodayDayIndex());
      setInterval(() => currentDayIndex && loadSchedule(currentDayIndex, true), REFRESH_INTERVAL);
    }

    init();
  </script>
</body>
</html>
